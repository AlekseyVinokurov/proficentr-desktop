[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proficentr-desktop"
version = "0.1.0"
description = "Настольное приложение для учебных центров ДПО и ПО"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
build = ["pyinstaller>=6.11,<7"]

[project.gui-scripts]
proficentr = "proficentr.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
