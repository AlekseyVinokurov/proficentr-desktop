[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proficentr-desktop"
version = "0.2.0"
description = "Настольное приложение для учебных центров ДПО и ПО"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "cryptography>=50,<51", "docxtpl>=0.20.2,<0.21", "Jinja2>=3.1.6,<4", "python-docx>=1.2,<2", "defusedxml>=0.7.1,<0.8", "openpyxl==3.1.5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
build = ["pyinstaller>=6.11,<7"]
security = ["bandit>=1.8,<2", "pip-audit>=2.9,<3"]

[project.gui-scripts]
proficentr = "proficentr.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
