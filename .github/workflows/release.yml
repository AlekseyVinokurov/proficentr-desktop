name: Официальный стабильный релиз

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Существующий тег vX.Y.Z на текущем main; публикация после подтверждения release'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: validate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG" || { echo "Запустите workflow с --ref выбранного релизного тега"; exit 1; }
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse origin/main)"
          echo "sha=$(git rev-parse "$RELEASE_TAG^{commit}")" >> "$GITHUB_OUTPUT"
          test -f LICENSE || { echo 'Лицензия должна быть утверждена до публичного релиза'; exit 1; }
  build:
    needs: validate
    uses: ./.github/workflows/windows.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
  publish:
    needs: [validate, build]
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements-release.txt
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Proficentr-Desktop-Windows
          path: dist
      - name: Подпись проверенного пакета
        env:
          RELEASE_ED25519_PRIVATE_KEY: ${{ secrets.RELEASE_ED25519_PRIVATE_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/sign_release.py "$env:RELEASE_TAG"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/Proficentr-*-Windows.zip
            dist/manifest.json
      - name: Публикация официального релиза
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $package = (Get-ChildItem 'dist/Proficentr-*-Windows.zip').FullName
          gh release create "$env:RELEASE_TAG" "$package" dist/manifest.json dist/manifest.sig --verify-tag --title "Proficentr Desktop $env:RELEASE_TAG" --notes-file CHANGELOG.md
