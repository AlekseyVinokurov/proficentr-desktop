name: Windows — тесты и сборка

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-release.txt
      - name: Установка фиксированных зависимостей
        run: |
          python -m pip install -r requirements-release.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Политика сетевых функций и статический анализ
        run: |
          python scripts/security_check.py
          python -m bandit -r src -q
      - name: Проверка известных уязвимостей зависимостей
        run: python -m pip_audit -r requirements-release.txt --disable-pip --no-deps
      - name: Поиск секретов в истории Git
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          Invoke-WebRequest 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e') { throw 'Gitleaks hash mismatch' }
          $tool = Join-Path $env:RUNNER_TEMP 'gitleaks'
          Expand-Archive $archive -DestinationPath $tool
          & (Join-Path $tool 'gitleaks.exe') git --redact --no-banner --log-opts='--all' .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Тесты
        run: python -m pytest -q
      - name: Сборка onedir
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name Proficentr --paths src run_proficentr.py
      - name: Сборка отдельного небольшого helper без Qt
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ProficentrUpdater --paths src run_updater.py
          Copy-Item dist/ProficentrUpdater.exe dist/Proficentr/ProficentrUpdater.exe
      - name: Проверка EXE и запуска собранного приложения
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/Proficentr/Proficentr.exe'
          if (!(Test-Path $exe)) { throw 'Proficentr.exe не найден' }
          $env:PROFICENTR_DATA_DIR = Join-Path $env:RUNNER_TEMP 'proficentr-smoke'
          for ($i = 0; $i -lt 2; $i++) {
            $process = Start-Process $exe -ArgumentList '--smoke-test' -PassThru
            if (!$process.WaitForExit(30000)) {
              $process.Kill()
              throw 'Превышено время запуска EXE'
            }
            if ($process.ExitCode -ne 0) { throw "Ошибка EXE: $($process.ExitCode)" }
          }
          if (!(Test-Path (Join-Path $env:PROFICENTR_DATA_DIR 'database/proficentr.sqlite3'))) {
            throw 'SQLite не создана'
          }
      - name: Упаковка официального формата ZIP
        shell: pwsh
        run: |
          $version = python -c 'from proficentr.updates import VERSION; print(VERSION)'
          Compress-Archive -Path dist/Proficentr -DestinationPath "dist/Proficentr-$version-Windows.zip"
      - name: Проверка обновления собранного EXE в Windows
        run: python scripts/windows_update_smoke.py
      - name: Загрузка ZIP (не пользовательский релиз)
        uses: actions/upload-artifact@v4
        with:
          name: Proficentr-Desktop-Windows
          path: dist/Proficentr-*-Windows.zip
          if-no-files-found: error
          retention-days: 14
